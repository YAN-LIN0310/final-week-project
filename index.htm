<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Speed Run - Professional Refactored v1.9.1</title>
    <style>
        /* CSS 保持不變，維持優良的視覺體驗 */
        body { margin: 0; background: #050505; height: 100vh; color: white; font-family: 'Consolas', monospace; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .layout-wrapper { display: flex; gap: 20px; align-items: flex-start; }
        .dashboard { width: 220px; background: #111; border: 2px solid #333; padding: 20px; border-radius: 8px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
        .dash-group { border-bottom: 1px solid #333; padding-bottom: 15px; }
        .dash-label { color: #888; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; }
        .dash-value { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
        .c-time { color: #ff4757; } .c-score { color: #f1c40f; } .c-high { color: #00d2d3; font-size: 20px; }
        #game-container { position: relative; border: 4px solid #333; width: 800px; height: 600px; background: #000; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        h1 { font-size: 60px; margin: 0; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 25px currentColor; }
        .btn { padding: 12px 40px; font-size: 20px; cursor: pointer; background: rgba(0,0,0,0.6); border: 2px solid #fff; color: #fff; border-radius: 4px; transition: 0.2s; margin: 8px; font-weight: bold; }
        .btn:hover { transform: scale(1.05); background: #fff; color: #000; }
        .btn-normal { border-color: #00d2d3; color: #00d2d3; } .btn-hard { border-color: #ff4757; color: #ff4757; }
        canvas { display: block; }
        .system-log { font-size: 12px; color: #555; height: 150px; overflow: hidden; margin-top: auto; }
    </style>
</head>
<body>

    <div class="layout-wrapper">
        <div class="dashboard">
            <div class="dash-group">
                <div class="dash-label">Remaining Time</div>
                <div class="dash-value c-time" id="timer-el">00:00</div>
            </div>
            <div class="dash-group">
                <div class="dash-label">Current Score</div>
                <div class="dash-value c-score" id="score-el">0</div>
            </div>
            <div class="dash-group">
                <div class="dash-label">High Score</div>
                <div class="dash-value c-high" id="high-score-el">0</div>
            </div>
            <div class="system-log" id="system-log">
                <div class="log-entry">System: PEP 8 Optimized</div>
                <div class="log-entry">Status: Review Completed</div>
            </div>
        </div>

        <div id="game-container">
            <div id="menu-overlay" class="overlay">
                <h1 style="color: #00d2d3;">SPEED RUN</h1>
                <p style="color: #bbb; margin: 10px 0 20px 0;">Procedural Death Labyrinth v1.9.1</p>
                <button class="btn btn-normal" onclick="startGame('normal')">正常挑戰</button>
                <button class="btn btn-hard" onclick="startGame('hard')">極限挑戰</button>
            </div>
            <div id="clear-overlay" class="overlay" style="display: none;">
                <h1 style="color: #f1c40f;">LEVEL CLEAR</h1>
                <button class="btn btn-normal" onclick="nextLevel('normal')">下一關 (普通)</button>
                <button class="btn btn-hard" onclick="nextLevel('hard')">下一關 (極限)</button>
            </div>
            <div id="fail-overlay" class="overlay" style="display: none;">
                <h1 style="color: #ff4757;">GAME OVER</h1>
                <p id="fail-msg" style="color:#aaa; margin-bottom: 20px;"></p>
                <button class="btn" onclick="showMainMenu()">重回主選單</button>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

<script>
/**
 * 常數定義 (遵循 UPPER_CASE 規範) [cite: 35]
 */
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;
const GRAVITY = 0.6;
const FPS = 60;
const FRAME_DELAY = 1000 / FPS;
const LADDER_BUFFER = 10;
const COIN_BONUS = 200; 
const ENEMY_SPEED = 2;
const GHOST_DELAY = 60; 
const SHIELD_COLOR = '#00f2ff'; 
const INVINCIBLE_DURATION = 60;

// DOM 節點快取
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer-el');
const scoreEl = document.getElementById('score-el');
const highScoreEl = document.getElementById('high-score-el');

canvas.width = CANVAS_WIDTH; 
canvas.height = CANVAS_HEIGHT;

/**
 * 遊戲狀態控制
 */
let score = 0;
// 增加防禦性解析，防止 localStorage 內容異常 [cite: 24, 27]
let highScore = parseInt(localStorage.getItem('mazeRunHighScore')) || 0;
let gameActive = false;
let isDead = false;
let startTime, timeLimit, lastTime = 0;

// 玩家資料物件
const player = { 
    x: 50, y: 530, width: 22, height: 22, color: '#00d2d3', 
    dx: 0, dy: 0, speed: 5, jumpPower: -11.5, grounded: false, onLadder: false,
    hasShield: false, shieldAngle: 0,
    invincible: false, invincibleTimer: 0 
};

// 實體容器
let platforms = [], ladders = [], traps = [], coins = [], enemies = [], particles = [], shields = [];
let playerTrail = []; 
let playerHistory = []; 
let goal = { x: 0, y: 0, w: 40, h: 65 };

highScoreEl.innerText = highScore;

/**
 * 系統日誌紀錄
 * @param {string} msg - 顯示內容
 */
function logSystem(msg) {
    const logEl = document.getElementById('system-log');
    const entry = document.createElement('div');
    entry.innerText = `> ${msg}`;
    logEl.appendChild(entry);
    if (logEl.children.length > 8) logEl.removeChild(logEl.firstChild);
}

/**
 * 關卡隨機生成演算法
 * @param {string} difficulty - 挑戰難度
 */
function generateLevel(difficulty) {
    // 重置狀態
    platforms = [{ x: 0, y: 580, w: 800, h: 20 }];
    ladders = []; traps = []; coins = []; enemies = []; shields = [];
    playerHistory = []; playerTrail = [];
    player.hasShield = false; 
    player.invincible = false;
    
    const layerCount = 4;
    const layerHeight = 110;
    let prevLadderX = 400; 
    
    for (let i = 1; i <= layerCount; i++) {
        let y = 580 - (i * layerHeight);
        let pMainX = prevLadderX + (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 120);
        
        // 邊界修正
        if (pMainX < 50) pMainX = 100; 
        if (pMainX > 650) pMainX = 600;
        
        let pMainW = (difficulty === 'hard' ? 90 : 130) + Math.random() * 40;
        let newPlatform = { x: pMainX, y: y, w: pMainW, h: 12 };
        
        platforms.push(newPlatform);
        ladders.push({ x: pMainX + 20, y: y, w: 35, h: layerHeight + 12 });
        prevLadderX = pMainX + 20;

        // 生成陷阱
        if (traps.length < 5 && Math.random() > 0.45 && y < 450) {
            traps.push({ x: newPlatform.x + (newPlatform.w / 2) - 10, y: newPlatform.y - 8, w: 20, h: 8 });
        }

        // 生成巡邏敵人
        const distToStart = Math.hypot(newPlatform.x - 50, newPlatform.y - 530);
        if (newPlatform.w > 100 && Math.random() > 0.5 && distToStart > 200) {
            enemies.push({
                type: 'patrol',
                x: newPlatform.x + 10, y: newPlatform.y - 20, w: 20, h: 20,
                dx: ENEMY_SPEED, platform: newPlatform, color: '#ff4757'
            });
        }
    }
    
    // 生成護甲 (30% 機率)
    if (Math.random() < 0.3) {
        let targetPlat = platforms[Math.floor(Math.random() * (platforms.length - 1)) + 1];
        shields.push({ x: targetPlat.x + targetPlat.w / 2 - 10, y: targetPlat.y - 30, size: 12, collected: false });
    }

    // 極限挑戰：生成幽靈
    if (difficulty === 'hard') {
        enemies.push({ type: 'phantom', x: -100, y: -100, w: 20, h: 20, color: 'rgba(255, 71, 87, 0.6)' });
        logSystem("PHANTOM STALKER STANDBY...");
    }

    // 生成金幣
    const coinCount = Math.floor(Math.random() * 9);
    for (let i = 0; i < coinCount; i++) {
        coins.push({ 
            x: 50 + Math.random() * 700, 
            y: 100 + Math.random() * 400, 
            size: 15, 
            collected: false, 
            angle: Math.random() * Math.PI * 2 
        });
    }
    
    const lastLadder = ladders[ladders.length - 1];
    platforms.push({ x: lastLadder.x - 30, y: lastLadder.y - 80, w: 100, h: 12 });
    goal = { x: lastLadder.x, y: lastLadder.y - 80 - 65, w: 40, h: 65 };
}

/**
 * 處理玩家受到的傷害邏輯 (穩定性優化) 
 */
function handleDamage(msg) {
    if (player.invincible) return;

    if (player.hasShield) {
        player.hasShield = false; 
        player.invincible = true;
        player.invincibleTimer = INVINCIBLE_DURATION;
        logSystem("SHIELD BROKEN! INVINCIBLE!");

        for (let i = 0; i < 20; i++) {
            particles.push({
                x: player.x + player.width / 2, y: player.y + player.height / 2,
                sx: (Math.random() - 0.5) * 15, sy: (Math.random() - 0.5) * 15,
                alpha: 1, size: Math.random() * 5 + 2, color: SHIELD_COLOR
            });
        }
    } else {
        triggerExplosion(msg); 
    }
}

/**
 * 死亡動畫與數據保存
 */
function triggerExplosion(msg) {
    if (isDead) return;
    isDead = true; 
    gameActive = false; 
    document.getElementById('fail-msg').innerText = msg;
    logSystem(`FAILURE: ${msg}`);

    if (score > highScore) { 
        highScore = score; 
        localStorage.setItem('mazeRunHighScore', score); 
        highScoreEl.innerText = highScore; 
    }
    
    particles = [];
    for (let i = 0; i < 40; i++) {
        particles.push({
            x: player.x + player.width / 2, y: player.y + player.height / 2,
            sx: (Math.random() - 0.5) * 10, sy: (Math.random() - 0.5) * 10,
            alpha: 1, size: Math.random() * 4 + 2, color: player.color
        });
    }
    requestAnimationFrame(explosionAnimationLoop);
    setTimeout(() => { document.getElementById('fail-overlay').style.display = 'flex'; }, 1200);
}

function explosionAnimationLoop() {
    if (!isDead) return;
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    drawStaticScene(); 
    let hasLiveParticles = false;
    particles.forEach(p => {
        p.x += p.sx; p.y += p.sy; p.alpha -= 0.02;
        if (p.alpha > 0) { 
            hasLiveParticles = true; 
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; 
            ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore(); 
        }
    });
    if (hasLiveParticles) requestAnimationFrame(explosionAnimationLoop);
}

/**
 * 玩家殘影特效更新
 */
function updatePlayerTrail() {
    if (Math.abs(player.dx) > 0.1 || Math.abs(player.dy) > 0.1) {
        playerTrail.push({
            x: player.x + player.width / 2 + (Math.random() - 0.5) * 10,
            y: player.y + player.height / 2 + (Math.random() - 0.5) * 10,
            w: Math.random() * 10 + 5, h: Math.random() * 10 + 5,
            alpha: 0.8, color: player.color
        });
    }
    for (let i = playerTrail.length - 1; i >= 0; i--) {
        let p = playerTrail[i];
        p.alpha -= 0.08; p.w *= 0.9; p.h *= 0.9;
        if (p.alpha <= 0) playerTrail.splice(i, 1);
    }
}

/**
 * 實體與碰撞邏輯拆解 (邏輯正確性優化) [cite: 20, 21]
 */
function processEntities() {
    // 敵人邏輯 (反向遍歷確保刪除安全)
    for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        if (en.type === 'patrol') {
            en.x += en.dx;
            if (en.x <= en.platform.x || en.x + en.w >= en.platform.x + en.platform.w) en.dx *= -1;
        } else if (en.type === 'phantom' && playerHistory.length > GHOST_DELAY) {
            const target = playerHistory[0]; // 防禦性思考：應考慮 target 是否存在 [cite: 28]
            if (target) {
                en.x += (target.x - en.x) * 0.12; 
                en.y += (target.y - en.y) * 0.12;
            }
        }

        // 碰撞判定
        if (player.x < en.x + en.w && player.x + player.width > en.x && 
            player.y < en.y + en.h && player.y + player.height > en.y) {
            if (player.hasShield && en.type === 'patrol') {
                enemies.splice(i, 1); 
                handleDamage("ENEMY NEUTRALIZED");
            } else {
                handleDamage(en.type === 'phantom' ? "CAUGHT BY PHANTOM" : "TERMINATED BY PATROL");
            }
        }
    }

    // 收集品判定 (金幣、護盾)
    shields.forEach(shield => {
        if (!shield.collected) {
            let hover = Math.sin(Date.now() / 200) * 5;
            if (player.x < shield.x + shield.size && player.x + player.width > shield.x - shield.size &&
                player.y < shield.y + hover + shield.size && player.y + player.height > shield.y + hover - shield.size) {
                if (!player.hasShield) { shield.collected = true; player.hasShield = true; logSystem("SHIELD ACQUIRED!"); }
            }
        }
    });

    coins.forEach(coin => { 
        if (!coin.collected) { 
            coin.angle += 0.05; 
            let hover = Math.sin(Date.now() / 200) * 5; 
            if (player.x < coin.x + coin.size && player.x + player.width > coin.x - coin.size && 
                player.y < coin.y + hover + coin.size && player.y + player.height > coin.y + hover - coin.size) { 
                coin.collected = true; score += COIN_BONUS; scoreEl.innerText = score; 
                logSystem(`COLLECTED: +${COIN_BONUS}`); 
            } 
        } 
    });
}

/**
 * 遊戲主要更新迴圈
 */
function update() {
    if (!gameActive || isDead) return;

    // 時間處理
    let elapsed = Date.now() - startTime;
    let remainingTime = timeLimit - elapsed;
    if (remainingTime <= 0) { triggerExplosion("TIME EXPIRED"); return; }
    
    // UI 更新
    timerEl.innerText = `${Math.floor(remainingTime/1000).toString().padStart(2,'0')}:${Math.floor((remainingTime%1000)/10).toString().padStart(2,'0')}`;

    // 無敵幀冷卻
    if (player.invincible) {
        player.invincibleTimer--;
        if (player.invincibleTimer <= 0) player.invincible = false;
    }

    // 歷史紀錄 (用於幽靈追蹤)
    playerHistory.push({ x: player.x, y: player.y });
    if (playerHistory.length > GHOST_DELAY + 5) playerHistory.shift();

    // 移動控制
    const keys = window.myKeys || {};
    player.dx = (keys['KeyA'] || keys['ArrowLeft']) ? -player.speed : (keys['KeyD'] || keys['ArrowRight']) ? player.speed : 0;
    
    // 梯子判定
    player.onLadder = false;
    ladders.forEach(ladder => { 
        if (player.x + player.width > ladder.x - LADDER_BUFFER && 
            player.x < ladder.x + ladder.w + LADDER_BUFFER && 
            player.y + player.height > ladder.y && 
            player.y < ladder.y + ladder.h) { 
            player.onLadder = true; 
        } 
    });

    if (player.onLadder) { 
        player.dy = 0; 
        if (keys['KeyW'] || keys['ArrowUp']) player.dy = -player.speed; 
        if (keys['KeyS'] || keys['ArrowDown']) player.dy = player.speed; 
    } else { 
        if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space']) && player.grounded) { 
            player.dy = player.jumpPower; player.grounded = false; 
        } 
        player.dy += GRAVITY; 
    }

    player.x += player.dx; 
    player.y += player.dy;
    
    updatePlayerTrail();
    if (player.hasShield) player.shieldAngle += 0.1;

    // 實體邏輯子程序
    processEntities();

    // 陷阱判定
    traps.forEach(trap => { 
        if (player.x < trap.x + trap.w && player.x + player.width > trap.x && 
            player.y < trap.y + trap.h && player.y + player.height > trap.y) handleDamage("TRAP TRIGGERED"); 
    });
    
    // 平台判定
    player.grounded = false;
    platforms.forEach(platform => { 
        if (player.dy >= 0 && player.x + player.width > platform.x && player.x < platform.x + platform.w && 
            player.y + player.height <= platform.y + 15 && player.y + player.height + player.dy >= platform.y) { 
            player.y = platform.y - player.height; player.dy = 0; player.grounded = true; 
        } 
    });

    // 邊界與勝敗判定
    if (player.x < 0) player.x = 0; 
    if (player.x + player.width > CANVAS_WIDTH) player.x = CANVAS_WIDTH - player.width;
    if (player.y > CANVAS_HEIGHT) triggerExplosion("FELL INTO ABYSS");
    
    if (player.x + player.width > goal.x && player.x < goal.x + goal.w && 
        player.y + player.height > goal.y && player.y < goal.y + goal.h) { 
        gameActive = false; score += (timeLimit < 15000 ? 100 : 50); 
        scoreEl.innerText = score; document.getElementById('clear-overlay').style.display = 'flex'; 
    }
}

/**
 * 繪圖子程序：殘影、場景與物件
 */
function drawPlayerTrail() {
    playerTrail.forEach(p => { 
        ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; 
        ctx.shadowBlur = 15; ctx.shadowColor = p.color; 
        ctx.fillRect(p.x - p.w/2, p.y - p.h/2, p.w, p.h); ctx.restore(); 
    });
}

function drawStaticScene() {
    // 梯子繪製
    ladders.forEach(ladder => { 
        ctx.save(); ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 6; ctx.shadowBlur = 25; ctx.shadowColor = '#39ff14'; ctx.globalAlpha = 0.3;
        ctx.strokeRect(ladder.x, ladder.y, ladder.w, ladder.h);
        ctx.globalAlpha = 1.0; ctx.lineWidth = 3; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(ladder.x, ladder.y); ctx.lineTo(ladder.x, ladder.y + ladder.h);
        ctx.moveTo(ladder.x + ladder.w, ladder.y); ctx.lineTo(ladder.x + ladder.w, ladder.y + ladder.h); ctx.stroke();
        ctx.lineWidth = 1.5;
        for (let i = 8; i < ladder.h; i += 12) {
            ctx.beginPath(); ctx.moveTo(ladder.x, ladder.y + i); ctx.lineTo(ladder.x + ladder.w, ladder.y + i); ctx.stroke();
        }
        ctx.restore();
    });

    // 平台繪製
    platforms.forEach(platform => { 
        ctx.save(); ctx.fillStyle = '#be2edd'; ctx.shadowBlur = 15; ctx.shadowColor = '#be2edd';
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
        ctx.fillStyle = '#efb2ff'; ctx.shadowBlur = 0; ctx.fillRect(platform.x, platform.y, platform.w, 2);
        ctx.restore();
    });

    // 敵人與幽靈繪製
    enemies.forEach(en => { 
        ctx.save(); ctx.fillStyle = en.color; 
        ctx.shadowBlur = en.type === 'phantom' ? 20 : 10; ctx.shadowColor = '#ff4757';
        if (en.type === 'phantom') {
            ctx.globalAlpha = 0.4 + Math.abs(Math.sin(Date.now() / 300)) * 0.4;
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.strokeRect(en.x, en.y, en.w, en.h);
        } else {
            ctx.fillRect(en.x, en.y, en.w, en.h);
            ctx.fillStyle = '#fff'; ctx.fillRect(en.x + 4, en.y + 4, 4, 4); ctx.fillRect(en.x + 12, en.y + 4, 4, 4);
        }
        ctx.restore();
    });

    // 金幣與護盾
    coins.forEach(coin => { 
        if (!coin.collected) { 
            ctx.save(); let hover = Math.sin(Date.now() / 200) * 5; let spinScale = Math.cos(coin.angle);
            ctx.translate(coin.x, coin.y + hover); ctx.scale(spinScale, 1);
            ctx.fillStyle = '#f1c40f'; ctx.shadowBlur = 15; ctx.shadowColor = '#f1c40f';
            ctx.beginPath(); ctx.arc(0, 0, coin.size, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
        } 
    });

    shields.forEach(shield => { 
        if (!shield.collected) { 
            ctx.save(); let hover = Math.sin(Date.now() / 300) * 5; ctx.translate(shield.x, shield.y + hover);
            ctx.rotate(Date.now() / 500); ctx.fillStyle = SHIELD_COLOR; ctx.shadowBlur = 20; ctx.shadowColor = SHIELD_COLOR;
            ctx.fillRect(-shield.size/2, -shield.size/2, shield.size, shield.size); ctx.restore();
        } 
    });

    // 終點
    ctx.save(); ctx.fillStyle = '#f1c40f'; ctx.shadowBlur = 35; ctx.shadowColor = '#f1c40f'; ctx.fillRect(goal.x, goal.y, goal.w, goal.h); ctx.restore();
}

/**
 * 主要渲染繪製
 */
function draw() { 
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT); 
    drawStaticScene(); 
    drawPlayerTrail();

    if (!isDead && gameActive) { 
        ctx.save(); 
        // 無敵閃爍特效
        if (player.invincible && Math.floor(Date.now() / 60) % 2 === 0) {
            ctx.globalAlpha = 0.3;
        }

        // 護盾旋轉特效
        if (player.hasShield) {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
            ctx.rotate(player.shieldAngle);
            ctx.strokeStyle = SHIELD_COLOR; ctx.lineWidth = 3; ctx.shadowBlur = 15; ctx.shadowColor = SHIELD_COLOR;
            let sz = player.width + 12; ctx.strokeRect(-sz/2, -sz/2, sz, sz);
            ctx.restore();
        }

        ctx.fillStyle = player.color; ctx.shadowBlur = 10; ctx.shadowColor = player.color; 
        ctx.fillRect(player.x, player.y, player.width, player.height); 
        ctx.restore(); 
    } 
}

/**
 * 遊戲進入點與控制器
 */
function gameLoop(t) { if (!gameActive) return; if (t - lastTime >= FRAME_DELAY) { update(); draw(); lastTime = t - (t - lastTime) % FRAME_DELAY; } requestAnimationFrame(gameLoop); }
function startGame(mode) { score = 0; scoreEl.innerText = 0; document.getElementById('menu-overlay').style.display = 'none'; startLevel(mode); }
function nextLevel(mode) { document.getElementById('clear-overlay').style.display = 'none'; startLevel(mode); }

function startLevel(mode) { 
    playerHistory = []; 
    timeLimit = (mode === 'hard' ? 12000 : 25000); 
    player.x = 50; player.y = 530; 
    generateLevel(mode); 
    isDead = false; gameActive = true; 
    startTime = Date.now(); lastTime = performance.now(); 
    requestAnimationFrame(gameLoop); 
}

function showMainMenu() { location.reload(); }
