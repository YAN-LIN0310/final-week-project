<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Speed Run - Professional Refactored v1.4</title>
    <style>
        body { margin: 0; background: #050505; height: 100vh; color: white; font-family: 'Consolas', monospace; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .layout-wrapper { display: flex; gap: 20px; align-items: flex-start; }
        .dashboard { width: 220px; background: #111; border: 2px solid #333; padding: 20px; border-radius: 8px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; }
        .dash-group { border-bottom: 1px solid #333; padding-bottom: 15px; }
        .dash-label { color: #888; font-size: 14px; margin-bottom: 5px; text-transform: uppercase; }
        .dash-value { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
        .c-time { color: #ff4757; } .c-score { color: #f1c40f; } .c-high { color: #00d2d3; font-size: 20px; }
        #game-container { position: relative; border: 4px solid #333; width: 800px; height: 600px; background: #000; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; }
        h1 { font-size: 60px; margin: 0; letter-spacing: 5px; text-transform: uppercase; text-shadow: 0 0 25px currentColor; }
        .btn { padding: 12px 40px; font-size: 20px; cursor: pointer; background: rgba(0,0,0,0.6); border: 2px solid #fff; color: #fff; border-radius: 4px; transition: 0.2s; margin: 8px; font-weight: bold; }
        .btn:hover { transform: scale(1.05); background: #fff; color: #000; }
        .btn-normal { border-color: #00d2d3; color: #00d2d3; } .btn-hard { border-color: #ff4757; color: #ff4757; }
        canvas { display: block; }
        .system-log { font-size: 12px; color: #555; height: 150px; overflow: hidden; margin-top: auto; }
    </style>
</head>
<body>

    <div class="layout-wrapper">
        <div class="dashboard">
            <div class="dash-group">
                <div class="dash-label">Remaining Time</div>
                <div class="dash-value c-time" id="timer-el">00:00</div>
            </div>
            <div class="dash-group">
                <div class="dash-label">Current Score</div>
                <div class="dash-value c-score" id="score-el">0</div>
            </div>
            <div class="dash-group">
                <div class="dash-label">High Score</div>
                <div class="dash-value c-high" id="high-score-el">0</div>
            </div>
            <div class="system-log" id="system-log">
                <div class="log-entry">Greed System Online...</div>
                <div class="log-entry">Risk vs Reward Active.</div>
            </div>
        </div>

        <div id="game-container">
            <div id="menu-overlay" class="overlay">
                <h1 style="color: #00d2d3;">SPEED RUN</h1>
                <p style="color: #bbb; margin: 10px 0 20px 0;">Procedural Death Labyrinth v1.4</p>
                <button class="btn btn-normal" onclick="startGame('normal')">正常挑戰</button>
                <button class="btn btn-hard" onclick="startGame('hard')">極限挑戰</button>
            </div>
            <div id="clear-overlay" class="overlay" style="display: none;">
                <h1 style="color: #f1c40f;">LEVEL CLEAR</h1>
                <button class="btn btn-normal" onclick="nextLevel('normal')">下一關 (普通)</button>
                <button class="btn btn-hard" onclick="nextLevel('hard')">下一關 (極限)</button>
            </div>
            <div id="fail-overlay" class="overlay" style="display: none;">
                <h1 style="color: #ff4757;">GAME OVER</h1>
                <p id="fail-msg" style="color:#aaa; margin-bottom: 20px;"></p>
                <button class="btn" onclick="showMainMenu()">重回主選單</button>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

<script>
/**
 * 遊戲常數配置
 */
const CANVAS_WIDTH = 800;
const CANVAS_HEIGHT = 600;
const GRAVITY = 0.6;
const FPS = 60;
const FRAME_DELAY = 1000 / FPS;
const LADDER_BUFFER = 10;
const COIN_BONUS = 200; // 每顆金幣的分數

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const timerEl = document.getElementById('timer-el');
const scoreEl = document.getElementById('score-el');
const highScoreEl = document.getElementById('high-score-el');

canvas.width = CANVAS_WIDTH; 
canvas.height = CANVAS_HEIGHT;

let score = 0;
let highScore = parseInt(localStorage.getItem('mazeRunHighScore')) || 0;
let gameActive = false;
let isDead = false;
let startTime, timeLimit, lastTime = 0;

const player = { 
    x: 50, y: 530, width: 22, height: 22, color: '#00d2d3', 
    dx: 0, dy: 0, speed: 5, jumpPower: -11.5, grounded: false, onLadder: false 
};

let platforms = [], ladders = [], traps = [], coins = [], particles = [];
let goal = { x: 0, y: 0, w: 40, h: 65 };

highScoreEl.innerText = highScore;

function logSystem(msg) {
    const logEl = document.getElementById('system-log');
    const entry = document.createElement('div');
    entry.innerText = `> ${msg}`;
    logEl.appendChild(entry);
    if(logEl.children.length > 8) logEl.removeChild(logEl.firstChild);
}

/**
 * 隨機關卡生成演算法 (新增金幣生成)
 */
function generateLevel(difficulty) {
    platforms = [{ x: 0, y: 580, w: 800, h: 20 }];
    ladders = []; 
    traps = [];
    coins = [];
    
    const layerCount = 4;
    const layerHeight = 110;
    let prevLadderX = 400; 
    
    for(let i = 1; i <= layerCount; i++) {
        let y = 580 - (i * layerHeight);
        let pMainX = prevLadderX + (Math.random() > 0.5 ? 1 : -1) * (120 + Math.random() * 120);
        if (pMainX < 50) pMainX = 100; if (pMainX > 650) pMainX = 600;
        let pMainW = (difficulty === 'hard' ? 90 : 130) + Math.random() * 40;
        
        let newPlatform = { x: pMainX, y: y, w: pMainW, h: 12 };
        platforms.push(newPlatform);
        ladders.push({ x: pMainX + 20, y: y, w: 35, h: layerHeight + 12 });
        prevLadderX = pMainX + 20;

        if (traps.length < 5 && Math.random() > 0.45) {
            traps.push({ x: newPlatform.x + (newPlatform.w/2) - 10, y: newPlatform.y - 8, w: 20, h: 8 });
        }
    }
    
    // 生成誘惑金幣 (0~8 顆)
    const coinCount = Math.floor(Math.random() * 9);
    for(let i = 0; i < coinCount; i++) {
        coins.push({
            x: 50 + Math.random() * 700,
            y: 100 + Math.random() * 400,
            baseY: 0, // 用於記錄初始高度進行飄動
            size: 15,
            collected: false,
            angle: Math.random() * Math.PI * 2 // 初始旋轉角度
        });
    }
    
    const lastLadder = ladders[ladders.length-1];
    platforms.push({ x: lastLadder.x - 30, y: lastLadder.y - 80, w: 100, h: 12 });
    goal = { x: lastLadder.x, y: lastLadder.y - 80 - 65, w: 40, h: 65 };
}

function triggerExplosion(msg) {
    if (isDead) return;
    isDead = true; gameActive = false; 
    document.getElementById('fail-msg').innerText = msg;
    logSystem(`FAILURE: ${msg}`);

    if (score > highScore) {
        highScore = score;
        localStorage.setItem('mazeRunHighScore', score);
        highScoreEl.innerText = highScore;
    }

    particles = [];
    for (let i = 0; i < 40; i++) {
        particles.push({
            x: player.x + player.width/2, y: player.y + player.height/2,
            sx: (Math.random() - 0.5) * 10, sy: (Math.random() - 0.5) * 10,
            alpha: 1, size: Math.random() * 4 + 2, color: player.color
        });
    }
    requestAnimationFrame(explosionAnimationLoop);
    setTimeout(() => { document.getElementById('fail-overlay').style.display = 'flex'; }, 1200);
}

function explosionAnimationLoop() {
    if (!isDead) return;
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    drawStaticScene(); 
    let hasLiveParticles = false;
    particles.forEach(p => {
        p.x += p.sx; p.y += p.sy; p.alpha -= 0.02;
        if (p.alpha > 0) {
            hasLiveParticles = true;
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore();
        }
    });
    if (hasLiveParticles) requestAnimationFrame(explosionAnimationLoop);
}

function update() {
    if (!gameActive || isDead) return;

    let elapsed = Date.now() - startTime;
    let remainingTime = timeLimit - elapsed;
    if (remainingTime <= 0) { remainingTime = 0; triggerExplosion("TIME EXPIRED"); return; }

    const secs = Math.floor(remainingTime / 1000).toString().padStart(2, '0');
    const msecs = Math.floor((remainingTime % 1000) / 10).toString().padStart(2, '0');
    timerEl.innerText = `${secs}:${msecs}`;

    const keys = window.myKeys || {};
    player.dx = (keys['KeyA'] || keys['ArrowLeft']) ? -player.speed : (keys['KeyD'] || keys['ArrowRight']) ? player.speed : 0;
    
    player.onLadder = false;
    ladders.forEach(ladder => { 
        if (player.x + player.width > ladder.x - LADDER_BUFFER && player.x < ladder.x + ladder.w + LADDER_BUFFER && 
            player.y + player.height > ladder.y && player.y < ladder.y + ladder.h) {
            player.onLadder = true; 
        } 
    });

    if (player.onLadder) {
        player.dy = 0;
        if (keys['KeyW'] || keys['ArrowUp']) player.dy = -player.speed;
        if (keys['KeyS'] || keys['ArrowDown']) player.dy = player.speed;
    } else {
        if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space']) && player.grounded) { player.dy = player.jumpPower; player.grounded = false; }
        player.dy += GRAVITY;
    }

    player.x += player.dx; player.y += player.dy;

    // 金幣碰撞與動畫更新
    coins.forEach(coin => {
        if (!coin.collected) {
            // 動畫更新
            coin.angle += 0.05; // 旋轉速度
            let hover = Math.sin(Date.now() / 200) * 5; // 上下飄動
            
            // 碰撞檢測 (金幣中心點半徑檢測)
            if (player.x < coin.x + coin.size && player.x + player.width > coin.x - coin.size &&
                player.y < coin.y + hover + coin.size && player.y + player.height > coin.y + hover - coin.size) {
                coin.collected = true;
                score += COIN_BONUS;
                scoreEl.innerText = score;
                logSystem(`COLLECTED: +${COIN_BONUS}`);
            }
        }
    });

    traps.forEach(trap => {
        if (player.x < trap.x + trap.w && player.x + player.width > trap.x && player.y < trap.y + trap.h && player.y + player.height > trap.y) {
            triggerExplosion("TRAP TRIGGERED");
        }
    });

    player.grounded = false;
    platforms.forEach(platform => {
        if (player.dy >= 0 && player.x + player.width > platform.x && player.x < platform.x + platform.w && 
            player.y + player.height <= platform.y + 15 && player.y + player.height + player.dy >= platform.y) {
            player.y = platform.y - player.height; player.dy = 0; player.grounded = true;
        }
    });

    if (player.x < 0) player.x = 0; if (player.x + player.width > CANVAS_WIDTH) player.x = CANVAS_WIDTH - player.width;
    if (player.y > CANVAS_HEIGHT) triggerExplosion("FELL INTO ABYSS");
    
    if (player.x + player.width > goal.x && player.x < goal.x + goal.w && player.y + player.height > goal.y && player.y < goal.y + goal.h) {
        gameActive = false; score += (timeLimit < 15000 ? 100 : 50); 
        scoreEl.innerText = score;
        document.getElementById('clear-overlay').style.display = 'flex';
    }
}

function drawStaticScene() {
    ladders.forEach(ladder => { 
        ctx.save();
        ctx.strokeStyle = '#39ff14'; ctx.lineWidth = 6; ctx.shadowBlur = 25; ctx.shadowColor = '#39ff14'; ctx.globalAlpha = 0.3;
        ctx.strokeRect(ladder.x, ladder.y, ladder.w, ladder.h);
        ctx.globalAlpha = 1.0; ctx.lineWidth = 3; ctx.shadowBlur = 10;
        ctx.beginPath(); ctx.moveTo(ladder.x, ladder.y); ctx.lineTo(ladder.x, ladder.y + ladder.h);
        ctx.moveTo(ladder.x + ladder.w, ladder.y); ctx.lineTo(ladder.x + ladder.w, ladder.y + ladder.h); ctx.stroke();
        ctx.lineWidth = 1.5;
        for(let i = 8; i < ladder.h; i += 12) {
            ctx.beginPath(); ctx.moveTo(ladder.x, ladder.y + i); ctx.lineTo(ladder.x + ladder.w, ladder.y + i); ctx.stroke();
        }
        ctx.restore();
    });

    platforms.forEach(platform => {
        ctx.save();
        ctx.fillStyle = '#be2edd'; ctx.shadowBlur = 15; ctx.shadowColor = '#be2edd';
        ctx.fillRect(platform.x, platform.y, platform.w, platform.h);
        ctx.fillStyle = '#efb2ff'; ctx.shadowBlur = 0; ctx.fillRect(platform.x, platform.y, platform.w, 2);
        ctx.restore();
    });

    traps.forEach(trap => {
        ctx.save();
        ctx.fillStyle = '#ff4757'; ctx.shadowBlur = 20; ctx.shadowColor = '#ff4757';
        ctx.fillRect(trap.x, trap.y, trap.w, trap.h);
        ctx.fillStyle = '#ffffff'; ctx.globalAlpha = 0.5; ctx.fillRect(trap.x + 5, trap.y + 2, trap.w - 10, 2); 
        ctx.restore();
    });

    // 繪製金幣 (誘惑系統)
    coins.forEach(coin => {
        if (!coin.collected) {
            ctx.save();
            let hover = Math.sin(Date.now() / 200) * 5;
            let spinScale = Math.cos(coin.angle); // 模擬旋轉的寬度變化
            
            ctx.translate(coin.x, coin.y + hover);
            ctx.scale(spinScale, 1); // 橫向縮放達成轉圈效果
            
            ctx.fillStyle = '#f1c40f';
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#f1c40f';
            
            // 繪製圓形金幣
            ctx.beginPath();
            ctx.arc(0, 0, coin.size, 0, Math.PI * 2);
            ctx.fill();
            
            // 內圈裝飾
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, coin.size * 0.6, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.restore();
        }
    });

    ctx.save();
    ctx.fillStyle = '#f1c40f'; ctx.shadowBlur = 35; ctx.shadowColor = '#f1c40f';
    ctx.fillRect(goal.x, goal.y, goal.w, goal.h);
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
    drawStaticScene();
    if (!isDead && gameActive) {
        ctx.save();
        ctx.fillStyle = player.color; ctx.shadowBlur = 10; ctx.shadowColor = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height); ctx.restore();
    }
}

function gameLoop(t) { 
    if (!gameActive) return; 
    if (t - lastTime >= FRAME_DELAY) { update(); draw(); lastTime = t - (t - lastTime) % FRAME_DELAY; } 
    requestAnimationFrame(gameLoop); 
}

function startGame(mode) { score = 0; scoreEl.innerText = 0; document.getElementById('menu-overlay').style.display = 'none'; startLevel(mode); }
function nextLevel(mode) { document.getElementById('clear-overlay').style.display = 'none'; startLevel(mode); }
function startLevel(mode) { 
    timeLimit = (mode === 'hard' ? 12000 : 25000); 
    player.x = 50; player.y = 530; 
    generateLevel(mode); 
    isDead = false; gameActive = true; 
    startTime = Date.now(); lastTime = performance.now(); 
    requestAnimationFrame(gameLoop); 
}
function showMainMenu() { location.reload(); }

window.myKeys = {}; 
window.addEventListener('keydown', e => window.myKeys[e.code] = true); 
window.addEventListener('keyup', e => window.myKeys[e.code] = false);

generateLevel('normal'); 
draw();
</script>
</body>
</html>
